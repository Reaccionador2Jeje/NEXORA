name: Build QEMU for Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-qemu-android.yml"
      - "scripts/package-qemu-android.py"
      - "scripts/build-qemu-android.sh"
      - "docs/QEMU_ANDROID_MIGRATION.md"

permissions:
  contents: read

concurrency:
  group: qemu-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare standalone Android toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Check out NEXORA
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bc bison build-essential cmake curl flex git \
            libtool meson ninja-build \
            pkg-config python3 python3-pip python3-venv qemu-efi-aarch64 unzip wget

      - name: Install official Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_ARCHIVE="android-ndk-r30-linux.zip"
          NDK_VERSION="30.0.16248370"
          NDK_SHA1="5107f898313790e449e87eee2183d9a20602dee9"
          mkdir -p "$RUNNER_TEMP/android"
          cd "$RUNNER_TEMP/android"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/$NDK_ARCHIVE" \
            -o "$NDK_ARCHIVE"
          echo "$NDK_SHA1  $NDK_ARCHIVE" | sha1sum --check -
          unzip -q "$NDK_ARCHIVE"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android/android-ndk-r30" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
          test -x "$RUNNER_TEMP/android/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Fetch upstream QEMU source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/qemu/qemu.git qemu-src
          git -C qemu-src fetch --depth 1 origin refs/tags/v10.1.2:refs/tags/v10.1.2
          git -C qemu-src checkout --detach v10.1.2
          git -C qemu-src rev-parse HEAD | tee qemu-src/UPSTREAM_COMMIT.txt

      - name: Validate standalone toolchain and source
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" --version
          test -f qemu-src/configure
          test -f qemu-src/meson.build
          grep -q -- '--target-list=' qemu-src/configure
          git -C qemu-src describe --tags --exact-match | grep -Fx 'v10.1.2'
          {
            echo "Build model: standalone Android NDK; no Termux runtime or package builder"
            echo "Android ABI: arm64-v8a"
            echo "Android API: 24"
            echo "Android NDK: $ANDROID_NDK_VERSION"
            echo "QEMU source: $(git -C qemu-src describe --tags --always)"
            echo "QEMU commit: $(cat qemu-src/UPSTREAM_COMMIT.txt)"
          } | tee qemu-src/NEXORA_ANDROID_BUILD_INFO.txt

      - name: Build QEMU and Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexora-qemu/src"
          mv qemu-src "$RUNNER_TEMP/nexora-qemu/src/qemu"
          QEMU_WORK_DIR="$RUNNER_TEMP/nexora-qemu" \
            BUILD_JOBS=2 bash scripts/build-qemu-android.sh

      - name: Package matching ARM64 UEFI firmware
        shell: bash
        run: |
          set -euo pipefail
          firmware="artifacts/qemu-android-arm64/firmware"
          mkdir -p "$firmware" artifacts/qemu-android-arm64/licenses/edk2
          test -s /usr/share/AAVMF/AAVMF_CODE.fd
          test -s /usr/share/AAVMF/AAVMF_VARS.fd
          gzip -n -9 -c /usr/share/AAVMF/AAVMF_CODE.fd > "$firmware/AAVMF_CODE.fd.gz"
          gzip -n -9 -c /usr/share/AAVMF/AAVMF_VARS.fd > "$firmware/AAVMF_VARS.fd.gz"
          cp /usr/share/doc/qemu-efi-aarch64/copyright artifacts/qemu-android-arm64/licenses/edk2/
          (
            cd "$firmware"
            sha256sum AAVMF_CODE.fd.gz AAVMF_VARS.fd.gz > SHA256SUMS
          )

      - name: Upload standalone QEMU ARM64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: nexora-qemu-android-arm64-candidate
          path: artifacts/qemu-android-arm64/
          if-no-files-found: error
          retention-days: 14
