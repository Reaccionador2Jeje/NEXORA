name: Validate QEMU on PC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qemu-pc.yml"
      - "docs/**"
      - "scripts/check-qemu-pc.sh"
      - "scripts/check-qemu-pc.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-pc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Native QEMU on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
            command: qemu-system-x86_64
          - os: windows-latest
            install: choco install qemu -y --no-progress
            command: qemu-system-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out NEXORA
        uses: actions/checkout@v4

      - name: Install native QEMU
        shell: bash
        run: ${{ matrix.install }}

      - name: Add QEMU to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qemuDir = Join-Path $env:ProgramFiles "qemu"
          if (Test-Path (Join-Path $qemuDir "qemu-system-x86_64.exe")) {
            Add-Content -Path $env:GITHUB_PATH -Value $qemuDir
          }

      - name: Verify QEMU executable
        shell: bash
        run: |
          set -euo pipefail
          command -v ${{ matrix.command }}
          ${{ matrix.command }} --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate NEXORA QEMU integration
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace
          cargo run -p nexora-cli -- qemu-check
          cargo build --workspace --release
