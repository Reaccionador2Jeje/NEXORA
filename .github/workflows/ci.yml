name: NEXORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read


jobs:
  validate:
    name: Validate and build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nexora-linux-x64
            binary_path: target/release/nex
          - os: windows-latest
            artifact_name: nexora-windows-x64
            binary_path: target/release/nex.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build release CLI
        run: cargo build --workspace --release

      - name: Upload Linux CLI
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-linux-x64
          path: target/release/nex
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-x64
          path: target/release/nex.exe
          if-no-files-found: error
          retention-days: 14

  android-build:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools, ndk;23.2.8568313

      - name: Build standalone PRoot for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$SDK_ROOT/ndk/23.2.8568313"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          git clone https://github.com/green-green-avk/build-proot-android.git "$RUNNER_TEMP/build-proot-android"
          git -C "$RUNNER_TEMP/build-proot-android" checkout --detach 01f83b8841358450c78333d1b33ab30d4943bec4
          cd "$RUNNER_TEMP/build-proot-android"
          sed -i "s|^ARCHS=.*|ARCHS='aarch64'|" config
          sed -i "s|^NDK=.*|NDK=\"$ANDROID_NDK_HOME\"|" config
          ./build.sh
          ./make-proot-for-apk.sh
          output="$RUNNER_TEMP/build-proot-android/build/root-aarch64/root-apk/bin"
          destination="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$destination"
          install -m 0755 "$output/libproot.so" "$destination/libproot.so"
          install -m 0644 "$output/libproot-loader.so" "$destination/libproot-loader.so"
          test -s "$destination/libproot.so"
          test -s "$destination/libproot-loader.so"
          file "$destination/libproot.so" "$destination/libproot-loader.so"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest

      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
