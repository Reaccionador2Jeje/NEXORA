name: NEXORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nexora-linux-x64
            binary_path: target/release/nex
          - os: windows-latest
            artifact_name: nexora-windows-x64
            binary_path: target/release/nex.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build release CLI
        run: cargo build --workspace --release

      - name: Upload Linux CLI
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-linux-x64
          path: target/release/nex
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-x64
          path: target/release/nex.exe
          if-no-files-found: error
          retention-days: 14

  android-build:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Package verified PRoot binaries for Android ABIs
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs
          release="$(curl -fsSL https://api.github.com/repos/ahmed-alnassif/proot/releases/latest)"
          for pair in "arm64-v8a:aarch64" "armeabi-v7a:arm" "x86_64:x86_64" "x86:x86"; do
            abi="${pair%%:*}"
            arch="${pair##*:}"
            asset="proot-${arch}.zip"
            url="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .browser_download_url' <<< "$release")"
            digest="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .digest' <<< "$release" | sed 's/^sha256://')"
            test -n "$url" && [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]]
            curl -fL "$url" -o "/tmp/$asset"
            echo "$digest  /tmp/$asset" | sha256sum -c -
            mkdir -p "/tmp/proot-$abi"
            unzip -q "/tmp/$asset" -d "/tmp/proot-$abi"
            binary="$(find "/tmp/proot-$abi" -type f -name proot -print -quit)"
            test -n "$binary"
            mkdir -p "app/src/main/jniLibs/$abi"
            install -m 0755 "$binary" "app/src/main/jniLibs/$abi/libproot.so"
          done

      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
