name: NEXORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build QEMU for Android ARM64"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: nexora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nexora-linux-x64
            binary_path: target/release/nex
          - os: windows-latest
            artifact_name: nexora-windows-x64
            binary_path: target/release/nex.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build release CLI
        run: cargo build --workspace --release

      - name: Upload Linux CLI
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-linux-x64
          path: target/release/nex
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-x64
          path: target/release/nex.exe
          if-no-files-found: error
          retention-days: 14

  android-build:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download verified standalone QEMU artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: nexora-qemu-android-arm64-candidate
          path: /tmp/nexora-qemu-android-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Package QEMU runtime into Android assets
        if: github.event_name == 'workflow_run'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nexora-qemu-android-arm64
          sha256sum --check SHA256SUMS
          cd firmware
          sha256sum --check SHA256SUMS
          cd /tmp/nexora-qemu-android-arm64
          test -s qemu-system-aarch64
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p app/src/main/assets/qemu/arm64-v8a
          install -m 0755 /tmp/nexora-qemu-android-arm64/qemu-system-aarch64 app/src/main/assets/qemu/arm64-v8a/
          find /tmp/nexora-qemu-android-arm64 -maxdepth 1 -type f -name '*.so*' \
            -exec install -m 0644 {} app/src/main/assets/qemu/arm64-v8a/ +
          install -m 0644 /tmp/nexora-qemu-android-arm64/SHA256SUMS app/src/main/assets/qemu/arm64-v8a/
          mkdir -p app/src/main/assets/qemu/arm64-v8a/firmware
          install -m 0644 /tmp/nexora-qemu-android-arm64/firmware/AAVMF_CODE.fd.gz app/src/main/assets/qemu/arm64-v8a/firmware/
          install -m 0644 /tmp/nexora-qemu-android-arm64/firmware/AAVMF_VARS.fd.gz app/src/main/assets/qemu/arm64-v8a/firmware/
          install -m 0644 /tmp/nexora-qemu-android-arm64/firmware/SHA256SUMS app/src/main/assets/qemu/arm64-v8a/firmware/
          test -s app/src/main/assets/qemu/arm64-v8a/qemu-system-aarch64
          test -s app/src/main/assets/qemu/arm64-v8a/SHA256SUMS

      - name: Verify Android VM provisioning unit tests
        working-directory: android
        run: gradle testDebugUnitTest

      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload Android debug APK
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
